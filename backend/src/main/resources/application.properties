server.port=${SERVER_PORT:8080}
spring.application.name=vault-rewards-engine

# Active profile: fallback to 'dev' when no profile is explicitly provided
spring.profiles.default=dev

# Open-in-view configuration (disabled for performance & preventing anti-patterns)
spring.jpa.open-in-view=false

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# Springdoc OpenAPI Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}

