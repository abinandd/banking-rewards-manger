server.port=${SERVER_PORT:8080}
spring.application.name=vault-rewards-engine

# Active profile: fallback to 'dev' when no profile is explicitly provided
spring.profiles.default=dev

# Open-in-view configuration (disabled for performance & preventing anti-patterns)
spring.jpa.open-in-view=false

# Request size limits — prevent oversized payload attacks
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
server.tomcat.max-http-form-post-size=2MB

# Jackson configuration — fail on unknown properties to avoid silent data loss
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true

# Springdoc OpenAPI Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:80}
